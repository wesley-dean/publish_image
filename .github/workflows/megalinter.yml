---
name: MegaLinter

# yamllint disable-line rule:truthy
on:
  # Triggers mega-linter when a pull_request event's activity type is opened, synchronize, or reopened by default.
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  # Comment env block if you do not want to apply fixes
  # Apply linter fixes configuration
  APPLY_FIXES: all # When active, APPLY_FIXES must also be defined as environment variable (in github/workflows/mega-linter.yml or other CI tool)
  APPLY_FIXES_EVENT: pull_request # Decide which event triggers application of fixes in a commit or a PR (pull_request, push, all)
  APPLY_FIXES_MODE: commit # If APPLY_FIXES is used, defines if the fixes are directly committed (commit) or posted in a PR (pull_request)

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    name: MegaLinter
    runs-on: ubuntu-22.04
    permissions: write-all
    steps:
      # Git Checkout
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pin@v4
        with:
          token: ${{ secrets.PAT || secrets.GITHUB_TOKEN || github.token }}
          fetch-depth: 1

      # MegaLinter
      - name: MegaLinter
        id: ml
        uses: oxsecurity/megalinter/flavors/security@8fbdead70d1409964ab3d5afa885e18ee85388bb # pin@v9.4.0
        env:
          VALIDATE_ALL_CODEBASE: false
          GITHUB_TOKEN: ${{ secrets.PAT || secrets.GITHUB_TOKEN || github.token }}

      - name: "Import GPG key"
        id: import-gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # pin@v7.0.0
        if: steps.ml.outputs.has_updated_sources == 1 && (env.APPLY_FIXES_EVENT == 'all' || env.APPLY_FIXES_EVENT == github.event_name) && env.APPLY_FIXES_MODE == 'commit' && github.ref != 'refs/heads/main' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PRIVATE_KEY_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      # Upload MegaLinter artifacts
      - name: Archive production artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # pin@v6.0.0
        with:
          name: MegaLinter reports
          path: |
            megalinter-reports
            megalinter-reports/megalinter.log

      # Create pull request if applicable (for now works only on PR from same repository, not from forks)
      - name: Create Pull Request with applied fixes
        id: cpr
        if: steps.ml.outputs.has_updated_sources == 1 && (env.APPLY_FIXES_EVENT == 'all' || env.APPLY_FIXES_EVENT == github.event_name) && env.APPLY_FIXES_MODE == 'pull_request' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # pin@v5
        with:
          token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
          commit-message: "[MegaLinter] Apply linters automatic fixes"
          title: "[MegaLinter] Apply linters automatic fixes"
          labels: bot
      - name: Create PR output
        if: steps.ml.outputs.has_updated_sources == 1 && (env.APPLY_FIXES_EVENT == 'all' || env.APPLY_FIXES_EVENT == github.event_name) && env.APPLY_FIXES_MODE == 'pull_request' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          pull-request-number: ${{ steps.cpr.outputs.pull-request-number }}
          pull-request-url: ${{ steps.cpr.outputs.pull-request-url }}
        run: |
          echo "Pull Request Number - ${pull-request-number}"
          echo "Pull Request URL - ${pull-request-url}"

      # Push new commit if applicable (for now works only on PR from same repository, not from forks)
      - name: Prepare commit
        if: steps.ml.outputs.has_updated_sources == 1 && (env.APPLY_FIXES_EVENT == 'all' || env.APPLY_FIXES_EVENT == github.event_name) && env.APPLY_FIXES_MODE == 'commit' && github.ref != 'refs/heads/main' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        run: sudo chown -Rc $UID .git/

      - name: Commit and push applied linter fixes
        if: steps.ml.outputs.has_updated_sources == 1 && (env.APPLY_FIXES_EVENT == 'all' || env.APPLY_FIXES_EVENT == github.event_name) && env.APPLY_FIXES_MODE == 'commit' && github.ref != 'refs/heads/main' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: stefanzweifel/git-auto-commit-action@04702edda442b2e678b25b537cec683a1493fcb9 # pin@v5
        with:
          branch: ${{ github.event.pull_request.head.ref || github.head_ref || github.ref }}
          commit_message: "[MegaLinter] Apply linters fixes"
          commit_author: "${{ steps.import-gpg.outputs.name }} <${{ steps.import-gpg.outputs.email }}>"
          commit_user_name: ${{ steps.import-gpg.outputs.name }}
          commit_user_email: ${{ steps.import-gpg.outputs.email }}

      - name: Check to see if the SARIF a was generated
        id: sarif_file_exists
        uses: andstor/file-existence-action@558493d6c74bf472d87c84eab196434afc2fa029 # pin@v3.1.0
        with:
          files: "megalinter-reports/megalinter-report.sarif"

      # only attempt to upload the SARIF file if it exists and if the
      # repository is public (private / internal repos likely don't have GHAS)
      - name: Upload MegaLinter scan results to GitHub Security tab
        if: steps.sarif_file_exists.outputs.files_exists == 'true' && github.event.repository.visibility == 'public'
        uses: github/codeql-action/upload-sarif@95e58e9a2cdfd71adc6e0353d5c52f41a045d225 # pin@v3.29.5
        with:
          sarif_file: "megalinter-reports/megalinter-report.sarif"

  # #99: contract tests, no credentials, no registry publication.
  offline:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out proposed action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test inputs, tags, failure and output secrecy
        shell: bash
        run: bash tests/publisher-contract.bash

  release-no-push:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out proposed action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Exercise v0 tag from explicit verified event data
        id: release
        uses: ./
        with:
          github_ref: refs/heads/main
          repository_name: certbotbot
          context: tests/fixtures
          dockerfile: tests/fixtures/Dockerfile
          platforms: linux/amd64
          push: 'false'
          dockerhub_image: dryrun/certbotbot
          ghcr_image: dryrun/certbotbot
          verified_release_ref: refs/tags/v0.2.3
          verified_source_sha: 0123456789abcdef0123456789abcdef01234567
          build_args: |
            SOURCE_COMMIT=0123456789abcdef0123456789abcdef01234567
            RELEASE_VERSION=0.2.3
            PRODUCER_SHA256=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
            HANDOFF_MANIFEST_SHA256=bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
            BUILD_KIND=release

      - name: Inspect the locally loaded image and nonsecret metadata
        shell: bash
        env:
          TAGS: ${{ steps.release.outputs.tags }}
          RELEASE_REF: ${{ steps.release.outputs.release_ref }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$RELEASE_REF" = refs/tags/v0.2.3
          test "$SOURCE_SHA" = 0123456789abcdef0123456789abcdef01234567
          grep -Fx 'docker.io/dryrun/certbotbot:latest' <<< "$TAGS"
          grep -Fx 'ghcr.io/dryrun/certbotbot:0.2.3' <<< "$TAGS"
          grep -Fx 'ghcr.io/dryrun/certbotbot:sha-0123456' <<< "$TAGS"
          if grep -q ':edge$' <<< "$TAGS"; then exit 1; fi
          image='ghcr.io/dryrun/certbotbot:0.2.3'
          test "$(docker image inspect "$image" \
            --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" \
            = 0123456789abcdef0123456789abcdef01234567
          test "$(docker image inspect "$image" \
            --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')" \
            = 0.2.3
          test "$(docker image inspect "$image" \
            --format '{{ index .Config.Labels "test.build_kind" }}')" = release
          test "$(docker image inspect "$image" \
            --format '{{ index .Config.Labels "test.source_commit" }}')" \
            = 0123456789abcdef0123456789abcdef01234567
          test "$(docker image inspect "$image" \
            --format '{{ index .Config.Labels "test.handoff_sha256" }}')" \
            = bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb

  nonrelease-no-push:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out proposed action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Exercise legacy nonrelease metadata without credentials
        id: branch
        uses: ./
        with:
          github_ref: refs/heads/main
          repository_name: certbotbot
          context: tests/fixtures
          dockerfile: tests/fixtures/Dockerfile
          platforms: linux/amd64
          push: 'false'
          dockerhub_image: dryrun/certbotbot
          ghcr_image: dryrun/certbotbot
          build_args: |
            SOURCE_COMMIT=0123456789abcdef0123456789abcdef01234567
            BUILD_KIND=local

      - name: Reject release-only tags in nonrelease context
        shell: bash
        env:
          TAGS: ${{ steps.branch.outputs.tags }}
          RELEASE_REF: ${{ steps.branch.outputs.release_ref }}
        run: |
          set -euo pipefail
          test -z "$RELEASE_REF"
          test -n "$TAGS"
          if grep -Eq ':(latest|0\.2\.3|0\.2|0)$' <<< "$TAGS"; then
            printf '%s\n' 'Nonrelease selected a release tag' >&2
            exit 1
          fi
